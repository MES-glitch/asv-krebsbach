# Konfiguration des Redaktionsbereichs (Sveltia CMS) – erreichbar unter /admin
backend:
  name: github
  repo: MES-glitch/asv-krebsbach
  branch: main
  commit_messages:
    create: "{{collection}}: „{{slug}}“ angelegt"
    update: "{{collection}}: „{{slug}}“ geändert"
    delete: "{{collection}}: „{{slug}}“ gelöscht"
    uploadMedia: "Bild „{{path}}“ hochgeladen"
    deleteMedia: "Bild „{{path}}“ gelöscht"

locale: de
logo_url: ../logo.webp
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: termine
    label: Termine
    label_singular: Termin
    description: Arbeitseinsätze, Hegefischen, Versammlungen und Veranstaltungen. Vergangene Termine wandern automatisch ins Archiv.
    folder: src/content/termine
    create: true
    slug: "{{datum}}-{{titel}}"
    summary: "{{datum}} · {{titel}}"
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: bis, label: "Bis (nur bei mehrtägigen Terminen)", widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD", required: false }
      - { name: uhrzeit, label: Uhrzeit, widget: string, required: false, hint: "z. B. 09:00 oder 09:00–13:00" }
      - { name: ort, label: Ort, widget: string, required: false }
      - name: kategorie
        label: Kategorie
        widget: select
        options: [Arbeitseinsatz, Hegefischen, Versammlung, Veranstaltung, Sonstiges]
        default: Sonstiges
      - { name: nurMitglieder, label: Nur für Mitglieder, widget: boolean, default: false }
      - { name: body, label: Beschreibung, widget: text, required: false }

  - name: neuigkeiten
    label: Neuigkeiten
    label_singular: Neuigkeit
    description: Berichte und Neuigkeiten aus dem Vereinsleben.
    folder: src/content/neuigkeiten
    create: true
    slug: "{{titel}}"
    summary: "{{datum}} · {{titel}}"
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: kurztext, label: Kurztext (Vorschau), widget: text, required: false }
      - { name: bild, label: Titelbild, widget: image, required: false }
      - { name: entwurf, label: "Entwurf (noch nicht veröffentlichen)", widget: boolean, default: false }
      - { name: body, label: Text, widget: markdown }

  - name: seiten
    label: Seiten
    label_singular: Seite
    description: Feste Seiten der Webseite.
    files:
      - { name: gewaesser, label: Gewässer, file: src/content/seiten/gewaesser.md, fields: &seitenfelder [ { name: dachzeile, label: Dachzeile, widget: string, required: false, hint: "Kleine Zeile über dem Titel" }, { name: titel, label: Titel, widget: string }, { name: beschreibung, label: Untertitel, widget: string, required: false }, { name: bild, label: Foto, widget: image, required: false, hint: "Erscheint rechts neben dem Titel" }, { name: bildPlatzhalter, label: Foto-Platzhalter, widget: hidden, required: false }, { name: body, label: Inhalt, widget: markdown } ] }
      - { name: verein, label: "Verein & Kontakt (Einleitung)", file: src/content/seiten/verein.md, fields: *seitenfelder }
      - { name: impressum, label: Impressum, file: src/content/seiten/impressum.md, fields: *seitenfelder }
      - { name: datenschutz, label: Datenschutz, file: src/content/seiten/datenschutz.md, fields: *seitenfelder }

  - name: dartnews
    label: Dart-News
    label_singular: Dart-News
    description: Spielberichte und Neuigkeiten der Dart-Abteilung.
    folder: src/content/dartnews
    create: true
    slug: "{{datum}}-{{titel}}"
    summary: "{{datum}} · {{titel}}"
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: team, label: Mannschaft, widget: select, options: [{ label: Beide / Abteilung, value: alle }, { label: Krebsbachbomber, value: krebsbachbomber }, { label: Petri Pfeil, value: petri-pfeil }], default: alle }
      - { name: kurztext, label: Kurztext (Vorschau), widget: text, required: false }
      - { name: bild, label: Bild, widget: image, required: false }
      - { name: entwurf, label: "Entwurf (noch nicht veröffentlichen)", widget: boolean, default: false }
      - { name: body, label: Text, widget: markdown }

  - name: einstellungen
    label: Startseite, Verein & Vorstand
    description: Texte und Fotos der Startseite, allgemeine Angaben zum Verein und die Vorstandsmitglieder.
    files:
      - name: startseite
        label: Startseite
        file: src/data/startseite.json
        fields:
          - { name: hinweis, label: Hinweis-Etikett, widget: string, hint: "Kleines Etikett über der Überschrift" }
          - { name: titel, label: Überschrift, widget: string }
          - { name: titelAkzent, label: Überschrift (zweite Zeile in Blau), widget: string }
          - { name: text, label: Begrüßungstext, widget: text }
          - { name: bildGross, label: Großes Foto (Gewässer / Steg), widget: image, required: false }
          - { name: bildKlein, label: Kleines Foto (Menschen im Verein), widget: image, required: false }
          - { name: vorteileTitel, label: Überschrift der drei Kacheln, widget: string }
          - name: vorteile
            label: Kacheln
            label_singular: Kachel
            widget: list
            summary: "{{titel}}"
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: link, label: Verlinkte Seite, widget: select, options: ["/gewaesser/", "/termine/", "/jugend/", "/mitgliedschaft/", "/verein/", "/neuigkeiten/"] }
              - { name: bild, label: Foto, widget: image, required: false }
              - { name: platzhalter, label: Text im Foto-Platzhalter, widget: string, required: false }
          - { name: aufrufTitel, label: Aufruf unten – Überschrift, widget: string }
          - { name: aufrufText, label: Aufruf unten – Text, widget: text }
          - { name: aufrufBild, label: Aufruf unten – Foto, widget: image, required: false }
      - name: mitgliedschaft
        label: Mitgliedschaft
        file: src/data/mitgliedschaft.json
        fields:
          - { name: titel, label: Titel, widget: string }
          - { name: untertitel, label: Untertitel, widget: text }
          - { name: bild, label: Foto oben, widget: image, required: false }
          - { name: einleitung, label: Einleitung, widget: text }
          - name: arten
            label: Arten der Mitgliedschaft
            label_singular: Art
            widget: list
            allow_add: false
            allow_remove: false
            summary: "{{titel}}"
            fields:
              - { name: id, label: Kennung, widget: hidden }
              - { name: titel, label: Titel, widget: string }
              - { name: kurz, label: Kurzbeschreibung, widget: string }
              - { name: punkte, label: Punkte, widget: list }
              - { name: hinweis, label: Hinweis, widget: text, required: false }
          - { name: ablaufTitel, label: Überschrift Ablauf, widget: string }
          - { name: ablauf, label: Ablauf-Schritte, widget: list }
          - { name: hinweisGastkarten, label: Hinweis Gastkarten, widget: text }
      - name: jugend
        label: Jugendabteilung
        file: src/data/jugend.json
        fields:
          - { name: titel, label: Titel, widget: string }
          - { name: untertitel, label: Untertitel, widget: text }
          - { name: bild, label: Foto oben, widget: image, required: false }
          - { name: einleitung, label: Einleitung, widget: text }
          - { name: aktivitaetenTitel, label: Überschrift Aktivitäten, widget: string }
          - name: aktivitaeten
            label: Aktivitäten
            label_singular: Aktivität
            widget: list
            summary: "{{titel}}"
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: bild, label: Foto, widget: image, required: false }
              - { name: platzhalter, label: Text im Foto-Platzhalter, widget: string, required: false }
          - { name: voraussetzungen, label: Voraussetzungen, widget: list }
          - { name: anmeldung, label: Anmeldung, widget: text }
          - { name: regeln, label: Wichtigste Regeln, widget: list }
          - { name: regelnHinweis, label: Hinweis unter den Regeln, widget: text }
      - name: dart
        label: Dart-Abteilung
        file: src/data/dart.json
        fields:
          - { name: titel, label: Titel (ASV-Seite), widget: string }
          - { name: untertitel, label: Untertitel (ASV-Seite), widget: string }
          - { name: einleitung, label: Einleitung (ASV-Seite), widget: text }
          - { name: bild, label: Foto (ASV-Seite), widget: image, required: false }
          - { name: dartHeld, label: Große Überschrift Dart-Bereich, widget: string, hint: "Sätze mit Punkt trennen – der letzte Satz wird rot" }
          - { name: dartIntro, label: Einleitung Dart-Bereich, widget: text }
          - { name: spielort, label: Heimspielort, widget: string }
          - { name: training, label: Trainingszeiten, widget: string }
          - name: teams
            label: Mannschaften
            label_singular: Mannschaft
            widget: list
            allow_add: false
            allow_remove: false
            summary: "{{name}}"
            fields:
              - { name: id, label: Kennung, widget: hidden }
              - { name: name, label: Name, widget: string }
              - { name: kuerzel, label: Kürzel, widget: string }
              - { name: farbe, label: Farbe, widget: select, options: [rot, gruen] }
              - { name: slogan, label: Slogan, widget: string }
              - { name: beschreibung, label: Beschreibung, widget: text }
              - { name: liga, label: Liga, widget: string }
              - { name: bild, label: Mannschaftsfoto, widget: image, required: false }
              - { name: logo, label: Team-Logo (freigestellt), widget: image, required: false }
              - { name: thema, label: Farbthema, widget: hidden, required: false }
              - { name: eventId, label: 3K-Portal Event-ID, widget: number, value_type: int, hint: "Aus dem Portal-Link: …/event/<b>40354</b>/participants/…" }
              - { name: participantId, label: 3K-Portal Mannschafts-ID, widget: number, value_type: int, hint: "Aus dem Portal-Link: …/participants/<b>683347</b>" }
              - name: spieler
                label: Spitznamen & Rollen (optional)
                label_singular: Spieler
                hint: "Der Kader kommt automatisch aus dem 3K-Portal. Hier nur Spitznamen oder Rollen ergänzen – der Name muss genau wie im Portal geschrieben sein."
                widget: list
                summary: "{{name}}"
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: spitzname, label: Spitzname, widget: string, required: false }
                  - { name: rolle, label: Rolle, widget: string, required: false, hint: "z. B. Kapitän" }
      - name: verein
        label: Vereinsangaben & Startseite
        file: src/data/verein.json
        fields:
          - { name: name, label: Kurzname, widget: string }
          - { name: vollerName, label: Vollständiger Name, widget: string }
          - { name: gruendungsjahr, label: Gründungsjahr, widget: number, value_type: int }
          - { name: orte, label: Orte, widget: list, hint: "Orte, für die der Verein steht (erscheinen auf Startseite und im Fußbereich)" }
          - { name: slogan, label: Kurzbeschreibung (für Suchmaschinen), widget: string }
          - { name: anschrift, label: Anschrift, widget: text }
          - { name: email, label: E-Mail, widget: string }
          - { name: telefon, label: Telefon, widget: string, required: false }
          - { name: termineHinweis, label: Hinweis auf der Terminseite, widget: text, required: false }
      - name: vorstand
        label: Vorstand
        file: src/data/vorstand.json
        fields:
          - name: mitglieder
            label: Vorstandsmitglieder
            label_singular: Vorstandsmitglied
            widget: list
            summary: "{{amt}}: {{name}}"
            fields:
              - { name: amt, label: Amt, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: email, label: E-Mail, widget: string, required: false }
              - { name: telefon, label: Telefon, widget: string, required: false }
              - { name: foto, label: Foto, widget: image, required: false }
