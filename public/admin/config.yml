# Konfiguration des Redaktionsbereichs (Sveltia CMS) – erreichbar unter /admin
backend:
  name: github
  repo: MES-glitch/asv-krebsbach
  branch: main
  commit_messages:
    create: "{{collection}}: „{{slug}}“ angelegt"
    update: "{{collection}}: „{{slug}}“ geändert"
    delete: "{{collection}}: „{{slug}}“ gelöscht"
    uploadMedia: "Bild „{{path}}“ hochgeladen"
    deleteMedia: "Bild „{{path}}“ gelöscht"

locale: de
logo_url: ../logo.webp
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: termine
    label: Termine
    label_singular: Termin
    description: Arbeitseinsätze, Hegefischen, Versammlungen und Veranstaltungen. Vergangene Termine wandern automatisch ins Archiv.
    folder: src/content/termine
    create: true
    slug: "{{datum}}-{{titel}}"
    summary: "{{datum}} · {{titel}}"
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: bis, label: "Bis (nur bei mehrtägigen Terminen)", widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD", required: false }
      - { name: uhrzeit, label: Uhrzeit, widget: string, required: false, hint: "z. B. 09:00 oder 09:00–13:00" }
      - { name: ort, label: Ort, widget: string, required: false }
      - name: kategorie
        label: Kategorie
        widget: select
        options: [Arbeitseinsatz, Hegefischen, Versammlung, Veranstaltung, Sonstiges]
        default: Sonstiges
      - { name: nurMitglieder, label: Nur für Mitglieder, widget: boolean, default: false }
      - { name: body, label: Beschreibung, widget: text, required: false }

  - name: neuigkeiten
    label: Neuigkeiten
    label_singular: Neuigkeit
    description: Berichte und Neuigkeiten aus dem Vereinsleben.
    folder: src/content/neuigkeiten
    create: true
    slug: "{{titel}}"
    summary: "{{datum}} · {{titel}}"
    sortable_fields: [datum, titel]
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: kurztext, label: Kurztext (Vorschau), widget: text, required: false }
      - { name: bild, label: Titelbild, widget: image, required: false }
      - { name: entwurf, label: "Entwurf (noch nicht veröffentlichen)", widget: boolean, default: false }
      - { name: body, label: Text, widget: markdown }

  - name: seiten
    label: Seiten
    label_singular: Seite
    description: Feste Seiten der Webseite.
    files:
      - { name: gewaesser, label: Gewässer, file: src/content/seiten/gewaesser.md, fields: &seitenfelder [ { name: dachzeile, label: Dachzeile, widget: string, required: false, hint: "Kleine Zeile über dem Titel" }, { name: titel, label: Titel, widget: string }, { name: beschreibung, label: Untertitel, widget: string, required: false }, { name: bild, label: Foto, widget: image, required: false, hint: "Erscheint rechts neben dem Titel" }, { name: bildPlatzhalter, label: Foto-Platzhalter, widget: hidden, required: false }, { name: body, label: Inhalt, widget: markdown } ] }
      - { name: mitgliedschaft, label: Mitgliedschaft & Gastkarten, file: src/content/seiten/mitgliedschaft.md, fields: *seitenfelder }
      - { name: verein, label: "Verein & Kontakt (Einleitung)", file: src/content/seiten/verein.md, fields: *seitenfelder }
      - { name: impressum, label: Impressum, file: src/content/seiten/impressum.md, fields: *seitenfelder }
      - { name: datenschutz, label: Datenschutz, file: src/content/seiten/datenschutz.md, fields: *seitenfelder }

  - name: einstellungen
    label: Startseite, Verein & Vorstand
    description: Texte und Fotos der Startseite, allgemeine Angaben zum Verein und die Vorstandsmitglieder.
    files:
      - name: startseite
        label: Startseite
        file: src/data/startseite.json
        fields:
          - { name: hinweis, label: Hinweis-Etikett, widget: string, hint: "Kleines Etikett über der Überschrift" }
          - { name: titel, label: Überschrift, widget: string }
          - { name: titelAkzent, label: Überschrift (zweite Zeile in Blau), widget: string }
          - { name: text, label: Begrüßungstext, widget: text }
          - { name: bildGross, label: Großes Foto (Gewässer / Steg), widget: image, required: false }
          - { name: bildKlein, label: Kleines Foto (Menschen im Verein), widget: image, required: false }
          - { name: vorteileTitel, label: Überschrift der drei Kacheln, widget: string }
          - name: vorteile
            label: Kacheln
            label_singular: Kachel
            widget: list
            summary: "{{titel}}"
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: link, label: Verlinkte Seite, widget: select, options: ["/gewaesser/", "/termine/", "/mitgliedschaft/", "/verein/", "/neuigkeiten/"] }
              - { name: bild, label: Foto, widget: image, required: false }
              - { name: platzhalter, label: Text im Foto-Platzhalter, widget: string, required: false }
          - { name: aufrufTitel, label: Aufruf unten – Überschrift, widget: string }
          - { name: aufrufText, label: Aufruf unten – Text, widget: text }
          - { name: aufrufBild, label: Aufruf unten – Foto, widget: image, required: false }
      - name: verein
        label: Vereinsangaben & Startseite
        file: src/data/verein.json
        fields:
          - { name: name, label: Kurzname, widget: string }
          - { name: vollerName, label: Vollständiger Name, widget: string }
          - { name: gruendungsjahr, label: Gründungsjahr, widget: number, value_type: int }
          - { name: orte, label: Orte, widget: list, hint: "Orte, für die der Verein steht (erscheinen auf Startseite und im Fußbereich)" }
          - { name: slogan, label: Kurzbeschreibung (für Suchmaschinen), widget: string }
          - { name: anschrift, label: Anschrift, widget: text }
          - { name: email, label: E-Mail, widget: string }
          - { name: telefon, label: Telefon, widget: string, required: false }
      - name: vorstand
        label: Vorstand
        file: src/data/vorstand.json
        fields:
          - name: mitglieder
            label: Vorstandsmitglieder
            label_singular: Vorstandsmitglied
            widget: list
            summary: "{{amt}}: {{name}}"
            fields:
              - { name: amt, label: Amt, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: email, label: E-Mail, widget: string, required: false }
              - { name: telefon, label: Telefon, widget: string, required: false }
              - { name: foto, label: Foto, widget: image, required: false }
